name: Bug report
about: Create an issue to report a bug in the project.
title: "Bug: ${{short_description}}"
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please provide as much detail as you can so we can reproduce and fix it.
  - type: input
    id: short_description
    attributes:
      label: Short description
      description: One-line summary of the bug
      placeholder: "e.g. Crash on login when password contains #"
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the exact steps to reproduce the bug
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Choose a priority to help with triage
      options:
        - high
        - medium
        - low
  - type: dropdown
    id: effort
    attributes:
      label: Effort (T-shirt size)
      options:
        - XS
        - S
        - M
        - L
        - XL
  - type: input
    id: environment
    attributes:
      label: Environment (OS / browser / version)
      description: Where the bug occurred (optional)
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Any logs, screenshots, or links
